name: "Setup Maven"
description: "Instala uma versão fixa do Apache Maven a partir do Maven Central, independente do Maven que vem na imagem do runner."
# Por que a versão é fixada:
# A imagem ubuntu-24.04 dos runners do GitHub passou a trazer o Maven 3.10.0 (com o Maven Resolver 2.x),
# que removeu a classe org.eclipse.aether.spi.locator.ServiceLocator. O quarkus-maven-plugin 2.x depende
# dela e o build falha em "generate-code". Fixamos o Maven 3.9.x até que todas as aplicações Quarkus 2.x
# sejam migradas para Quarkus 3.x; depois disso, atualize o default abaixo (e o input maven_version dos
# workflows maven-ci-cd*). Detalhes em readmes/README-MAVEN-VERSION.md.
inputs:
  version:
    description: "Versão do Apache Maven a ser instalada. Fixada em 3.9.x por compatibilidade com Quarkus 2.x."
    required: false
    default: "3.9.16"

runs:
  using: "composite"
  steps:
    - name: "Install Apache Maven ${{ inputs.version }}"
      shell: bash
      env:
        MAVEN_VERSION: ${{ inputs.version }}
      run: |
        set -euo pipefail
        if [[ ! "$MAVEN_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
          echo "::error::Versão do Maven inválida: '${MAVEN_VERSION}'. Use o formato X.Y.Z (ex.: 3.9.16)."
          exit 1
        fi
        base="https://repo1.maven.org/maven2/org/apache/maven/apache-maven/${MAVEN_VERSION}"
        file="apache-maven-${MAVEN_VERSION}-bin.tar.gz"
        curl -sSfL --retry 3 -o "${RUNNER_TEMP}/${file}" "${base}/${file}"
        expected=$(curl -sSfL --retry 3 "${base}/${file}.sha512" | awk '{print $1}')
        echo "${expected}  ${RUNNER_TEMP}/${file}" | sha512sum --check --status
        # Extrai em um diretório fixo para que o PATH não dependa do input.
        rm -rf "${RUNNER_TEMP}/maven"
        mkdir -p "${RUNNER_TEMP}/maven"
        tar -xzf "${RUNNER_TEMP}/${file}" -C "${RUNNER_TEMP}/maven" --strip-components=1
        echo "${RUNNER_TEMP}/maven/bin" >> "$GITHUB_PATH"
        "${RUNNER_TEMP}/maven/bin/mvn" -v
