name: maven-ci-cd-library

on:
  workflow_call:
    # Pipeline de CI/CD padrão para Bibliotecas Maven, incluindo build, testes, SonarQube e publicação do artefato.
    inputs:
      java_version:
        description: 'Versão do Java a ser usada'
        required: true
        type: string
      git_ref:
        description: 'A referência do Git (branch, tag, SHA) a ser buildada/publicada'
        required: true
        type: string
      is_production_branch:
        description: 'Indica se a execução é para uma branch de produção/release (master/main ou tags)'
        required: true
        type: boolean
      SONAR_BDSP_HOST_URL:
        description: 'URL do host do SonarQube'
        required: true
        type: string
      sonar_sources:
        description: 'Diretório principal dos fontes para o SonarQube. Ex: src/main/java'
        required: false
        type: string
      sonar_tests:
        description: 'Diretório principal dos testes para o SonarQube. Ex: src/test/java'
        required: false
        type: string
      sonar_java_binaries:
        description: 'Diretório dos binários compilados para o SonarQube. Ex: target/classes'
        required: false
        type: string
      coverage_reports_path:
        description: 'Diretório onde foi gerado o relatório de cobertura de testes. Ex: target/site/jacoco/jacoco.xml'
        required: false
        type: string

    secrets:
      SLACK_WEBHOOK_URL:
        description: 'Webhook URL do Slack para notificações'
        required: true
      SONAR_BDSP_TOKEN:
        description: 'Token de acesso ao SonarQube'
        required: true
      TOKEN_GITHUB:
        description: 'Token do GitHub para automação e publicação do pacote'
        required: true

env:
  JAVA_VERSION: ${{ inputs.java_version }}
  SONAR_LANGUAGE: "java"
  SONAR_MAIN_BRANCH: "master"
  SONAR_VISIBILITY: "private"
  SONAR_QUALITY_PROFILE: "Sonar way"
  SONAR_QUALITY_GATE: "QG_PNB_BACKEND"
  SONAR_PERMISSION_TEMPLATE: "PNB-TEMPLATE"
  SONAR_NEW_CODE_DEF_TYPE: "PREVIOUS_VERSION"

jobs:

  Notify_Start:
    runs-on: ubuntu-latest
    steps:
      - name: "Notify Slack: Start"
        uses: platformbuilders/github-actions-bdsp-templates/slack-notify@main
        with:
          type: "start"
          webhook_url: ${{ secrets.SLACK_WEBHOOK_URL }}

  Build_and_Test:
    needs: Notify_Start
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # Necessário para publicar libs no GitHub Packages

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.git_ref }}
          fetch-depth: 0

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '${{ env.JAVA_VERSION }}'
          server-id: github # Identifica o servidor Maven para injeção de credenciais
          settings-path: ${{ github.workspace }}

      - name: Build and Test with Maven
        run: |
          mvn clean package dependency:copy-dependencies -DoutputDirectory=./lib

      # --- Bloco de Governança do SonarQube ---
      - name: Check project existence in SonarQube
        id: checkSonarProjectExistence
        run: |
          set -e
          echo "Verificando se o projeto existe no SonarQube..."
          RESPONSE=$(curl --verbose --fail --location \
            "${{ inputs.SONAR_BDSP_HOST_URL }}/api/projects/search?projects=${{ github.event.repository.name }}" \
            --header "Authorization: Bearer ${{ secrets.SONAR_BDSP_TOKEN }}")
          FOUND_PROJECTS=$(echo "$RESPONSE" | jq -r '.paging.total' 2>/dev/null || echo "0")
          if [[ "$FOUND_PROJECTS" =~ ^[0-9]+$ && "$FOUND_PROJECTS" -eq 0 ]]; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
          else
            echo "exists=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Creating new project on SonarQube
        if: steps.checkSonarProjectExistence.outputs.exists == 'false'
        run: |
          set -e
          curl -f --location '${{ inputs.SONAR_BDSP_HOST_URL }}/api/projects/create' \
          --header 'Authorization: Bearer ${{ secrets.SONAR_BDSP_TOKEN }}' \
          --header 'Content-Type: application/x-www-form-urlencoded' \
          --data-urlencode 'project=${{ github.event.repository.name }}' \
          --data-urlencode 'name=${{ github.event.repository.name }}' \
          --data-urlencode 'mainBranch=${{env.SONAR_MAIN_BRANCH}}' \
          --data-urlencode 'newCodeDefinitionType=${{env.SONAR_NEW_CODE_DEF_TYPE}}' \
          --data-urlencode 'visibility=${{env.SONAR_VISIBILITY}}'

      - name: Configuring quality gate
        if: steps.checkSonarProjectExistence.outputs.exists == 'false'
        run: |
          set -e
          curl --location '${{ inputs.SONAR_BDSP_HOST_URL }}/api/qualitygates/select' \
          --header 'Authorization: Bearer ${{ secrets.SONAR_BDSP_TOKEN }}' \
          --header 'Content-Type: application/x-www-form-urlencoded' \
          --data-urlencode 'gateName=${{env.SONAR_QUALITY_GATE}}' \
          --data-urlencode 'projectKey=${{ github.event.repository.name }}'

      - name: Configuring quality profile
        if: steps.checkSonarProjectExistence.outputs.exists == 'false'
        run: |
          set -e
          curl --location '${{ inputs.SONAR_BDSP_HOST_URL }}/api/qualityprofiles/add_project' \
          --header 'Authorization: Bearer ${{ secrets.SONAR_BDSP_TOKEN }}' \
          --header 'Content-Type: application/x-www-form-urlencoded' \
          --data-urlencode 'language=${{env.SONAR_LANGUAGE}}' \
          --data-urlencode 'qualityProfile=${{env.SONAR_QUALITY_PROFILE}}' \
          --data-urlencode 'project=${{ github.event.repository.name }}'

      - name: Applying template permission
        if: steps.checkSonarProjectExistence.outputs.exists == 'false'
        run: |
          set -e
          curl --location '${{ inputs.SONAR_BDSP_HOST_URL }}/api/permissions/apply_template' \
          --header 'Authorization: Bearer ${{ secrets.SONAR_BDSP_TOKEN }}' \
          --header 'Content-Type: application/x-www-form-urlencoded' \
          --data-urlencode 'projectKey=${{ github.event.repository.name }}' \
          --data-urlencode 'templateName=${{env.SONAR_PERMISSION_TEMPLATE}}'

      - name: Get project version
        run: echo "PROJECT_VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)" >> $GITHUB_ENV

      - name: SonarQube Scan
        uses: sonarsource/sonarqube-scan-action@master
        env:
          SONAR_HOST_URL: ${{ inputs.SONAR_BDSP_HOST_URL }}
          SONAR_TOKEN: ${{ secrets.SONAR_BDSP_TOKEN }}
          SONAR_SOURCES: ${{ inputs.sonar_sources || 'src/main/java'}}
          SONAR_TESTS: ${{ inputs.sonar_tests || 'src/test/java' }}
          SONAR_JAVA_BINARIES: ${{ inputs.sonar_java_binaries || 'target/classes' }}
          COVERAGE_REPORTS_PATH: ${{ inputs.coverage_reports_path || 'target/site/jacoco/jacoco.xml'}}
        with:
          args: >-
            -Dsonar.projectKey=${{ github.event.repository.name }}
            -Dsonar.projectVersion=${{ env.PROJECT_VERSION }}
            -Dsonar.sources=${{ env.SONAR_SOURCES  }}
            -Dsonar.tests=${{ env.SONAR_TESTS }}
            -Dsonar.java.binaries=${{ env.SONAR_JAVA_BINARIES }}                          
            -Dsonar.sourceEncoding=UTF-8
            -Dsonar.language=java
            -Dsonar.coverage.jacoco.xmlReportPaths=${{ env.COVERAGE_REPORTS_PATH }}
            -Dsonar.java.libraries=./lib

      - name: SonarQube Quality Gate check
        uses: sonarsource/sonarqube-quality-gate-action@master
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_BDSP_TOKEN }}

      # --- ESTÁGIO DE CD: Publicação do Artefato (Apenas se for branch produtiva/tag) ---
      - name: Publish Package to GitHub Packages
        if: ${{ inputs.is_production_branch && success() }}
        run: |
          mvn --settings ${{ github.workspace }}/settings.xml deploy -DskipTests
        env:
          GITHUB_TOKEN: ${{ secrets.TOKEN_GITHUB }}

      # --- Notificações do Slack ---
      - name: "Notify Slack: Success"
        if: ${{ success() }}
        uses: platformbuilders/github-actions-bdsp-templates/slack-notify@main
        with:
          type: "success"
          webhook_url: ${{ secrets.SLACK_WEBHOOK_URL }}

      - name: "Notify Slack: Failure"
        if: ${{ failure() }}
        uses: platformbuilders/github-actions-bdsp-templates/slack-notify@main
        with:
          type: "failure"
          webhook_url: ${{ secrets.SLACK_WEBHOOK_URL }}