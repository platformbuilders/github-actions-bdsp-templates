name: 'Secret Scan'
on:
  push:
    branches:
      - main
      - develop
      - release/**
  pull_request:
    branches:
      - main
      - develop
      - release/**
  workflow_dispatch: 

jobs:
  trufflehog:
    name: 'TruffleHog Scan'
    runs-on: ubuntu-24.04

    steps:
      - name: 'Checkout code'
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: 'Run TruffleHog'
        uses: trufflesecurity/trufflehog@e76dff8a7e57d6df0c60ad8cbf5d5cba505a8fc9 # v3.99.2
        with:
          version: "3.99.2"
          path: ./
          extra_args: --only-verified
